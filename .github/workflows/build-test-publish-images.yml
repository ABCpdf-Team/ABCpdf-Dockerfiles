name: Build, Test and Publish ABCpdf Images

on:
  push:
    branches:
      - add-chiseled-image
  schedule:
     - cron: '0 3 * * 2'  # 4am UK time on Tuesdays (3am UTC for BST, 4am UTC would be 5am BST)
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continue running all jobs in the matrix even if one fails
      matrix:
        include:
          # Deprecated images
          - name: bookworm-slim-6.0
            dockerfile: dockerfiles/mcr-aspnet-bookworm-slim.Dockerfile
            target: ""
            dotnet-version: "6.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:6.0-bookworm-slim

          - name: bookworm-slim-7.0
            dockerfile: dockerfiles/mcr-aspnet-bookworm-slim.Dockerfile
            target: ""
            dotnet-version: "7.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:7.0-bookworm-slim

          - name: jammy-6.0
            dockerfile: dockerfiles/mcr-aspnet-jammy.Dockerfile
            target: ""
            dotnet-version: "6.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:6.0-jammy

          - name: jammy-7.0
            dockerfile: dockerfiles/mcr-aspnet-jammy.Dockerfile
            target: ""
            dotnet-version: "7.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:7.0-jammy

          # Currently supported
          - name: bookworm-slim-8.0
            dockerfile: dockerfiles/mcr-aspnet-bookworm-slim.Dockerfile
            target: ""
            dotnet-version: "8.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:8.0-bookworm-slim

          - name: jammy-8.0
            dockerfile: dockerfiles/mcr-aspnet-jammy.Dockerfile
            target: ""
            dotnet-version: "8.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:8.0-jammy

          - name: noble-8.0
            dockerfile: dockerfiles/mcr-aspnet-noble.Dockerfile
            target: ""
            dotnet-version: "8.0"
            abcpdf-version: "13"
            # noble is the default OS for its dotnet version, so it also gets
            # the bare "abcpdf/mcr-aspnet:<dotnet-version>" tag.
            tags: |
              abcpdf/mcr-aspnet:8.0-noble
              abcpdf/mcr-aspnet:8.0

          - name: noble-10.0
            dockerfile: dockerfiles/mcr-aspnet-noble.Dockerfile
            target: ""
            dotnet-version: "10.0"
            abcpdf-version: "13"
            tags: |
              abcpdf/mcr-aspnet:10.0-noble
              abcpdf/mcr-aspnet:10.0

          - name: resolute-10.0
            dockerfile: dockerfiles/mcr-aspnet-resolute.Dockerfile
            target: ""
            dotnet-version: "10.0"
            abcpdf-version: "14"
            tags: |
              abcpdf/mcr-aspnet:10.0-resolute

          - name: resolute-chiseled
            dockerfile: dockerfiles/abcpdf14-resolute-chiseled.Dockerfile
            target: final-runtime
            dotnet-version: "10.0"
            abcpdf-version: "14"
            # One tag per line - add as many as you like.
            tags: |
              abcpdf/abcpdf:10.0-resolute-chiseled

          # - name: resolute-chiseled-sdk
          #   dockerfile: dockerfiles/abcpdf14-resolute-chiseled.Dockerfile
          #   target: final-sdk
          #   dotnet-version: "10.0"
          #   abcpdf-version: "14"
          #   tags: |
          #     abcpdf/abcpdf:14-10.0-resolute-chiseled-sdk

          # Add more images here as they're created - just give each one a
          # unique name, dockerfile/target, and its own list of tags.

    env:
      ABCPDF_LICENSE_KEY: ${{ secrets.ABCPDF14_LICENSE_KEY }}
      BASE_IMAGE_TAG: abcpdf-rc-${{ matrix.name }}
      TEST_APP_IMAGE_TAG: abcpdf_test_app:${{ matrix.name }}
      # Condition for scans and publish to docker hub - on schedule, manual trigger, or pushes to main
      RUN_PUBLISH_STEPS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@v7

      # ---- Build --------------------------------------------------------------
      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} \
            --build-arg DOTNET_VERSION=${{ matrix.dotnet-version }} \
            -t ${{ env.BASE_IMAGE_TAG }} \
            ./dockerfiles

      # ---- Test -----------------------------------------------------------------
      - name: Build test application image
        run: |
          docker build -f ./TestApplication/Dockerfile \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE_TAG }} \
            --build-arg TARGET_FWK=net${{ matrix.dotnet-version }} \
            --build-arg ABCPDF_VERSION=${{ matrix.abcpdf-version }}.* \
            --build-arg BUILD_CONFIGURATION=Release \
            --build-arg SYMBOLS=ABCPDF_${{ matrix.abcpdf-version }} \
            --tag ${{ env.TEST_APP_IMAGE_TAG }} \
            ./TestApplication

      - name: Run test application
        run: |
          docker run --rm \
            --env ABCPDF_LICENSE_KEY=${{ env.ABCPDF_LICENSE_KEY }} \
            --name TestABCpdf-${{ matrix.name }} \
            ${{ env.TEST_APP_IMAGE_TAG }}

      # ---- Scan -----------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        if: env.RUN_PUBLISH_STEPS == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BASE_IMAGE_TAG }}
          format: 'template'
          template: '@.github/trivy/html.tpl'
          output: 'trivy-results.html'

      - name: Prepare scan report for pages
        if: env.RUN_PUBLISH_STEPS == 'true'
        run: |
          mkdir -p scan-reports
          cp trivy-results.html scan-reports/${{ matrix.name }}.html

      - name: Upload scan report for pages
        if: env.RUN_PUBLISH_STEPS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scan-report-${{ matrix.name }}
          path: scan-reports/

      # ---- Publish ----------------------------------------------------------
      # Pushing is commented out below until we're ready to publish these
      # images for real - `docker tag` still runs so the tagging logic itself
      # stays exercised on every build.
      - name: Log in to Docker Hub
        if: env.RUN_PUBLISH_STEPS == 'true'
        run: echo "Publish disabled for now - see commented-out steps below."
        # uses: docker/login-action@v4
        # with:
        #   username: ${{ secrets.DOCKER_HUB_USERNAME }}
        #   password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tag and publish image
        if: env.RUN_PUBLISH_STEPS == 'true'
        run: |
          echo "${{ matrix.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "${{ env.BASE_IMAGE_TAG }}" "$tag"
            echo "Tagged (not pushed): $tag"
            # docker push "$tag"
          done

  publish-scan-reports:
    # success() below is required (not just the GitHub Actions default) so
    # that a future edit adding always()/failure()/cancelled() to this
    # condition can't accidentally drop the "whole pipeline must pass" gate.
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: build-test-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download all scan reports
      uses: actions/download-artifact@v8
      with:
        pattern: scan-report-*
        path: scan-reports/
        merge-multiple: true

    - name: Create index page
      run: |
        cd scan-reports
        echo '<!DOCTYPE html><html><head><title>Trivy Scan Reports</title></head><body>' > index.html
        echo '<h1>ABCpdf Docker Image Vulnerability Scan Reports</h1><ul>' >> index.html
        for f in *.html; do
          [ "$f" != "index.html" ] && echo "<li><a href=\"$f\">$f</a></li>" >> index.html
        done
        echo '</ul></body></html>' >> index.html

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload to Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: scan-reports/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
